name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - run: bash scripts/install-godot.sh /usr/local/bin/godot
      - run: bash scripts/install-godot-templates.sh
        env:
          XDG_DATA_HOME: /tmp/godot-data
      - name: Install Playwright chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: /tmp/ms-playwright
        run: |
          mkdir -p /tmp/pw-tmp
          TMPDIR=/tmp/pw-tmp npx playwright install chromium
      - name: Exercise Godot web export and email-code sign-in
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          CLERK_ALLOWED_ORIGIN: ${{ secrets.CLERK_ALLOWED_ORIGIN }}
          AGENTMAIL_INBOX: ${{ secrets.AGENTMAIL_INBOX }}
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
          CLERK_OTP_FROM: ${{ secrets.CLERK_OTP_FROM }}
          CLERK_OTP_SUBJECT: ${{ secrets.CLERK_OTP_SUBJECT }}
          E2E_SIGN_IN_EMAIL: ${{ secrets.E2E_SIGN_IN_EMAIL }}
          GODOT_BIN: /usr/local/bin/godot
          XDG_DATA_HOME: /tmp/godot-data
          XDG_CONFIG_HOME: /tmp/godot-config
          PLAYWRIGHT_BROWSERS_PATH: /tmp/ms-playwright
          TMPDIR: /tmp/pw-tmp
          GODOT_SILENCE_ROOT_WARNING: "1"
        run: node scripts/live-e2e.mjs
      - name: Upload live evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-evidence
          path: dist/e2e-evidence.json
          if-no-files-found: error
