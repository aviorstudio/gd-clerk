name: e2e

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22.20.0"
          cache: npm
      - run: npm ci
      - name: Refuse until a live email-code run is observed
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PUBLISHABLE_KEY }}
          CLERK_FRONTEND_API: ${{ secrets.CLERK_FRONTEND_API }}
          CLERK_ALLOWED_ORIGIN: ${{ secrets.CLERK_ALLOWED_ORIGIN }}
          AGENTMAIL_INBOX: ${{ secrets.AGENTMAIL_INBOX }}
        run: node scripts/live-e2e.mjs
      - name: Upload live evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e2e-evidence
          path: dist/e2e-evidence.json
          if-no-files-found: error
